# Nginx config for the TrustTable frontend container (FND-01).
#
# - Serves the Vite production build.
# - Proxies /api/v1/* to the backend service.
# - Falls back to index.html for any other route (SPA client-side routing).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/v1/ {
        # Request-body size is limited by the backend, the single authority
        # (it counts bodies as they stream and answers 413 FILE_TOO_LARGE or
        # REQUEST_TOO_LARGE; docs/api-specification.md section 15). Leaving
        # nginx's default 1 MB limit in place refused larger uploads in this
        # deployment before the backend saw them (UX-02, D-068). Bodies are
        # streamed through rather than buffered to disk first.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_pass http://backend:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
