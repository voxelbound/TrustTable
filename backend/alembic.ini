; Alembic configuration (DB-01). `script_location` and `sqlalchemy.url`
; are both overridden programmatically at runtime by
; `trusttable_backend.persistence.database.run_migrations`, which sets
; them directly from `Settings.database_url` before every upgrade — the
; placeholder `sqlalchemy.url` below is never actually used to connect
; and exists only so this file is independently valid for `alembic`
; command-line invocations during local development.

[alembic]
script_location = alembic
sqlalchemy.url = sqlite:///./.alembic-placeholder.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
