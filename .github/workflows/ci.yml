name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (formatting, lint, types, tests, dependency scan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Formatting (ruff format --check)
        run: uv run ruff format --check src tests

      - name: Lint (ruff check)
        run: uv run ruff check src tests

      - name: Type check (mypy, strict)
        run: uv run mypy .

      - name: Unit/API tests (pytest)
        run: uv run pytest tests -v

      - name: Dependency scan (pip-audit)
        run: |
          uv export --no-hashes --no-emit-project -o /tmp/backend-requirements.txt
          uvx pip-audit --strict -r /tmp/backend-requirements.txt

  frontend:
    name: Frontend (formatting, lint, types, tests, dependency scan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Formatting (prettier --check)
        run: npm run format:check

      - name: Lint (oxlint)
        run: npm run lint

      - name: Type check (tsc -b --noEmit)
        run: npm run typecheck

      - name: Component tests (vitest)
        run: npm run test

      - name: Dependency scan (npm audit)
        run: npm audit --audit-level=high

  integration:
    name: Docker Compose integration smoke tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Docker Compose smoke tests (builds both images)
        run: uv run --project backend pytest tests/integration -v
